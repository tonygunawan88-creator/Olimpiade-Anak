<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olimpiade Anak - OMNAS 16</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #e0f7fa; text-align: center; padding: 15px; margin: 0; color: #333; }
  .card { background: white; max-width: 520px; margin: 10px auto; padding: 20px; border-radius: 22px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
  h1 { color: #ff6b6b; font-size: 23px; margin-bottom: 5px; }
  h2 { color: #118ab2; font-size: 20px; }
  .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn-tk { background: #ffd166; color: #333; }
  .btn-sd { background: #06d6a0; color: white; }
  .btn-mapel { background: #118ab2; color: white; }
  .btn-opt { background: #f8f9fa; color: #073b4c; border: 2px solid #118ab2; text-align: left; padding: 12px 16px; font-size: 16px; }
  .btn-cek { background: #06d6a0; color: white; margin-top: 12px; }
  .btn-next { background: #ff9f1c; color: white; margin-top: 15px; }
  .btn-back { background: #adb5bd; color: white; font-size: 15px; padding: 10px; margin-top: 20px; }
  .question { font-size: 18px; margin: 15px 0; color: #073b4c; font-weight: bold; line-height: 1.45; text-align: left; white-space: pre-line; }
  .input-esai { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #118ab2; border-radius: 15px; text-align: left; outline: none; font-family: inherit; resize: vertical; }
  .box-pembahasan { background: #fff3cd; border-left: 5px solid #ffca2c; padding: 12px; margin-top: 15px; border-radius: 10px; text-align: left; font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .benar-text { color: #06d6a0; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .salah-text { color: #ef476f; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .info-esai-text { color: #118ab2; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .badge-tipe { display: inline-block; background: #e0fbfc; color: #118ab2; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="card" id="menu-anak">
  <h1>🏆 Latihan Olimpiade 🏆</h1>
  <p>Siapa yang mau belajar hari ini?</p>
  <button class="btn btn-tk" onclick="pilihAnak('TK')">🐯 ZIO (Level TK)</button>
  <button class="btn btn-sd" onclick="pilihAnak('SD')">🐔 ECA (SD Kelas 1-2)</button>
</div>

<div class="card hidden" id="menu-mapel">
  <h2 id="judul-anak"></h2>
  <p>Pilih mata pelajaran:</p>
  <button class="btn btn-mapel" onclick="mulaiKuis('MTK')">🔢 Matematika & Logika</button>
  <button class="btn btn-mapel" onclick="mulaiKuis('IPA')">🌿 Sains / IPA (OMNAS 16)</button>
  <button class="btn btn-mapel" onclick="mulaiKuis('ING')">🔤 Bahasa Inggris</button>
  <button class="btn btn-back" onclick="kembaliKeAnak()">⬅ Ganti Profil</button>
</div>
<div class="card hidden" id="area-kuis">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <button onclick="keMenuMapel()" style="background:#eee; border:none; padding:6px 14px; border-radius:10px; font-weight:bold; color:#555; cursor:pointer;">Menu</button>
    <div id="info-soal" style="color: #888; font-weight: bold; font-size: 14px;"></div>
    <button onclick="keSoalSebelumnya()" style="background:#eee; border:none; padding:6px 14px; border-radius:10px; font-weight:bold; color:#555; cursor:pointer;">Back</button>
  </div>
  <div id="badge-tipe" class="badge-tipe"></div>


  <div class="question" id="teks-soal"></div>
  <div id="wadah-opsi"></div>
  <div id="wadah-esai" class="hidden">
    <textarea id="input-jawaban-esai" class="input-esai" rows="4" placeholder="Ketik jawabanmu di sini..."></textarea>
    <button id="tombol-cek-esai" class="btn btn-cek" onclick="cekJawabanEsai()">Lihat Kunci & Pembahasan ✔</button>
  </div>
  <div id="status-jawaban"></div>
  <div id="wadah-pembahasan" class="box-pembahasan hidden"></div>
  <button id="tombol-lanjut" class="btn btn-next hidden" onclick="soalBerikutnya()">Soal Berikutnya ➡</button>
</div>

<div class="card hidden" id="area-hasil">
  <h1>🎉 Horeee Selesai! 🎉</h1>
  <p id="teks-skor" style="font-size: 20px; font-weight: bold; color: #118ab2;"></p>
  <button class="btn btn-sd" onclick="kembaliKeMapel()">Pilih Pelajaran Lain</button>
  <button class="btn btn-back" onclick="kembaliKeAnak()">Ganti Profil Anak</button>
 
</div>

<script>
const DB = {
  TK: {
    MTK: [{t:'pg', q:'🍎 + 🍎 + 🍎 = Berapa jumlah apel?', o:['2 Apel','3 Apel','4 Apel'], j:1, b:'1 + 1 + 1 = 3 apel.'}],
    IPA: [{t:'pg', q:'Hewan mana yang punya belalai panjang?', o:['Kucing','Gajah','Kelinci'], j:1, b:'Gajah memiliki belalai panjang.'}],
    ING: [{t:'pg', q:'Apa bahasa Inggrisnya buah Apel?', o:['Banana','Apple','Orange'], j:1, b:'Apple artinya apel.'}]
  },
  SD: {
    MTK: [{t:'pg', q:'Andi punya 14 kelereng. Diberikan 5 ke Budi, lalu beli 3. Berapa kelereng Andi sekarang?', o:['11','12','13'], j:1, b:'14 - 5 + 3 = 12.'}],
    ING: [{t:'pg', q:'Today is Monday. Tomorrow is ...', o:['Sunday','Tuesday','Friday'], j:1, b:'Setelah Senin (Monday) adalah Selasa (Tuesday).'}],
    IPA: [
      {t:'pg', q:'1. Ketika kita mencium aroma bunga, bagian tubuh yang digunakan adalah ....', o:['Mata','Hidung','Telinga','Lidah'], j:1, b:'Hidung adalah indra penciuman.'},
      {t:'pg', q:'2. Rina melihat warna pelangi setelah hujan. Indra yang digunakan Rina adalah ....', o:['Peraba','Pengecap','Penglihatan','Pendengaran'], j:2, b:'Mata adalah indra penglihatan.'},
      {t:'pg', q:'3. Bagian tubuh yang membantu kita merasakan rasa makanan adalah ....', o:['Kulit','Lidah','Hidung','Gigi'], j:1, b:'Lidah adalah indra pengecap.'},
      {t:'pg', q:'4. Berikut ini yang merupakan ciri-ciri makhluk hidup adalah ....', o:['Tidak membutuhkan makanan','Tidak dapat bergerak','Tumbuh dan berkembang','Tidak membutuhkan air'], j:2, b:'Makhluk hidup tumbuh, berkembang, bernapas, dan butuh makan/minum.'},
      {t:'pg', q:'5. Tanaman yang diletakkan di tempat gelap dalam waktu lama akan mengalami kesulitan tumbuh karena kekurangan ....', o:['Cahaya','Batu','Pasir','Plastik'], j:0, b:'Tanaman butuh cahaya matahari untuk fotosintesis.'},
      {t:'pg', q:'6. Seekor kucing melahirkan anak kucing. Hal tersebut menunjukkan bahwa makhluk hidup dapat ....', o:['Menguap','Berkembang biak','Membeku','Mencair'], j:1, b:'Berkembang biak artinya menghasilkan keturunan.'},
      {t:'pg', q:'7. Ketika lampu dinyalakan, ruangan menjadi terang. Perubahan energi yang terjadi adalah ....', o:['Energi listrik menjadi energi cahaya','Energi panas menjadi energi gerak','Energi bunyi menjadi energi listrik','Energi cahaya menjadi energi makanan'], j:0, b:'Lampu mengubah energi listrik menjadi cahaya.'},
      {t:'pg', q:'8. Alat berikut yang mengubah energi listrik menjadi energi gerak adalah ....', o:['Setrika','Kipas angin','Lampu','Lilin'], j:1, b:'Baling-baling kipas angin bergerak menggunakan listrik.'},
      {t:'pg', q:'9. Saat kita berlari, tubuh memperoleh energi dari ....', o:['Makanan','Batu','Plastik','Kertas'], j:0, b:'Makanan diolah tubuh menjadi energi.'},
      {t:'pg', q:'10. Ibu menjemur pakaian basah di bawah sinar matahari. Pakaian menjadi kering karena air mengalami ....', o:['Pembekuan','Penguapan','Pencairan','Pembusukan'], j:1, b:'Panas matahari membuat air menguap menjadi uap air.'},
      {t:'pg', q:'11. Air yang dimasukkan ke dalam freezer dalam waktu cukup lama akan berubah menjadi ....', o:['Uap','Es','Udara','Minyak'], j:1, b:'Air membeku menjadi es di suhu dingin.'},
      {t:'pg', q:'12. Sumber cahaya alami terbesar bagi bumi adalah ....', o:['Lampu','Lilin','Matahari','Senter'], j:2, b:'Matahari adalah sumber cahaya alami terbesar.'},
      {t:'pg', q:'13. Benda yang dapat menghasilkan bayangan ketika terkena cahaya adalah ....', o:['Benda bening','Benda yang menghalangi cahaya','Udara','Cahaya itu sendiri'], j:1, b:'Bayangan muncul saat cahaya terhalang benda tidak tembus cahaya.'},
      {t:'pg', q:'14. Ketika tangan didekatkan ke api unggun, tangan terasa hangat. Hal ini menunjukkan bahwa api menghasilkan ....', o:['Bunyi','Panas','Air','Angin'], j:1, b:'Api menghasilkan energi panas.'},
      {t:'pg', q:'15. Pada siang hari, matahari tampak berada di langit. Pada malam hari, benda langit yang sering terlihat adalah ....', o:['Matahari dan pelangi','Bulan dan bintang','Awan dan matahari','Pelangi dan matahari'], j:1, b:'Bulan dan bintang terlihat pada malam hari.'},
        {t:'pg', q:'16. Bulan terlihat bersinar pada malam hari karena ....', o:['Bulan menghasilkan cahaya sendiri','Bulan memantulkan cahaya matahari','Bulan terbuat dari api','Bulan memiliki lampu'], j:1, b:'Bulan memantulkan cahaya dari matahari.'},
      {t:'pg', q:'17. Benda langit yang menjadi pusat tata surya adalah ....', o:['Bumi','Bulan','Matahari','Bintang'], j:2, b:'Matahari adalah pusat tata surya.'},
      {t:'pg', q:'18. Peristiwa siang dan malam terjadi karena ....', o:['Bumi berputar pada porosnya','Bulan mengelilingi matahari','Matahari mengelilingi bumi','Bintang berpindah tempat'], j:0, b:'Rotasi bumi menyebabkan siang dan malam.'},
      {t:'pg', q:'19. Perhatikan benda-benda berikut:\n- Batu\n- Kucing\n- Pohon mangga\n- Sepeda\n\nBenda yang termasuk makhluk hidup adalah ....', o:['Batu dan sepeda','Kucing dan pohon mangga','Batu dan pohon mangga','Sepeda dan kucing'], j:1, b:'Kucing (hewan) dan pohon mangga (tumbuhan) adalah makhluk hidup.'},
      {t:'pg', q:'20. Andi meletakkan dua tanaman yang sama. Tanaman A diberi air secara teratur, sedangkan tanaman B tidak diberi air. Setelah beberapa hari, tanaman B layu.\n\nKesimpulan yang tepat adalah ....', o:['Tanaman tidak membutuhkan air','Air membantu tanaman tetap hidup','Tanaman hanya membutuhkan batu','Air membuat tanaman mati'], j:1, b:'Air dibutuhkan tanaman agar tetap hidup.'},
      {t:'pg', q:'21. Perhatikan urutan berikut: Es batu → Air → Uap air.\nPerubahan wujud yang terjadi dari air menjadi uap air disebut ....', o:['Membeku','Mencair','Menguap','Mengembun'], j:2, b:'Cair menjadi gas disebut menguap.'},
      {t:'pg', q:'22. Benda berikut yang paling baik digunakan untuk melihat benda di baliknya adalah ....', o:['Kayu','Kardus','Kaca bening','Batu'], j:2, b:'Kaca bening tembus cahaya.'},
      {t:'pg', q:'23. Budi memukul dua benda. Benda pertama menghasilkan suara nyaring, sedangkan benda kedua menghasilkan suara pelan.\n\nIndra yang digunakan untuk membedakan kedua suara tersebut adalah ....', o:['Penglihatan','Pendengaran','Penciuman','Peraba'], j:1, b:'Telinga sebagai indra pendengaran membedakan bunyi.'},
      {t:'pg', q:'24. (ENGLISH) Which part of the body is used to hear sounds?', o:['Eyes','Nose','Ears','Hands'], j:2, b:'Ears artinya telinga untuk mendengar.'},
      {t:'pg', q:'25. (ENGLISH) Which one is a living thing?', o:['Rock','Chair','Tree','Pencil'], j:2, b:'Tree (pohon) adalah makhluk hidup.'},
      {t:'esai', q:'ESAI 1. Sebutkan lima pancaindra manusia beserta kegunaan masing-masing!', b:'1. Mata (penglihatan): untuk melihat.\n2. Telinga (pendengaran): untuk mendengar.\n3. Hidung (penciuman): untuk mencium bau.\n4. Lidah (pengecap): untuk merasakan rasa makanan.\n5. Kulit (peraba): untuk merasakan halus, kasar, panas, dingin.'},
      {t:'esai', q:'ESAI 2. Tuliskan empat ciri-ciri makhluk hidup!', b:'1. Bernapas.\n2. Membutuhkan makanan dan air.\n3. Bergerak.\n4. Tumbuh dan berkembang biak.'},
      {t:'esai', q:'ESAI 3. Mengapa tanaman membutuhkan air dan cahaya matahari untuk tumbuh?', b:'Untuk melakukan fotosintesis (membuat makanan sendiri) agar tumbuh subur.'},
      {t:'esai', q:'ESAI 4. Jelaskan mengapa kita dapat melihat bayangan tubuh ketika berdiri di bawah sinar matahari!', b:'Karena cahaya merambat lurus dan terhalang oleh tubuh kita yang tidak tembus cahaya.'},
      {t:'esai', q:'ESAI 5. Perhatikan percobaan berikut:\nAndi memasukkan dua buah es batu ke dalam wadah berbeda. Wadah A diletakkan di bawah sinar matahari, sedangkan wadah B di ruangan sejuk.\n- Es batu manakah yang lebih cepat mencair?\n- Mengapa hal tersebut dapat terjadi?\n- Apa kesimpulan dari percobaan tersebut?', b:'- Wadah A lebih cepat mencair.\n- Karena Wadah A terkena panas langsung dari sinar matahari.\n- Kesimpulan: Energi panas mempercepat proses mencairnya es batu.'}
    ]
  }
};

let anakAktif = '', daftarSoal = [], indeks = 0, skorPG = 0, totalPG = 0;
function pilihAnak(p) {
  anakAktif = p;
  document.getElementById('menu-anak').classList.add('hidden');
  document.getElementById('menu-mapel').classList.remove('hidden');
  document.getElementById('judul-anak').innerText = p === 'TK' ? '🧸 Menu Adik (TK)' : '🚀 Menu Kakak (SD 1-2)';
}
function kembaliKeAnak() {
  document.getElementById('menu-mapel').classList.add('hidden');
  document.getElementById('area-hasil').classList.add('hidden');
  document.getElementById('menu-anak').classList.remove('hidden');
}
function kembaliKeMapel() {
  document.getElementById('area-hasil').classList.add('hidden');
  document.getElementById('menu-mapel').classList.remove('hidden');
}
function keMenuMapel() {
  document.getElementById('area-kuis').classList.add('hidden');
  document.getElementById('menu-mapel').classList.remove('hidden');
}
function keSoalSebelumnya() {
  if (indeks > 0) {
    indeks--;
    tampilkanSoal();
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function bunyiNada(freqs, durasi, tipe = 'sine') {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = tipe;
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + idx * 0.12);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime + idx * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + durasi);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + idx * 0.12);
    osc.stop(audioCtx.currentTime + idx * 0.12 + durasi);
  });
}

function bicara(teks) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID';
    u.rate = 1.05;
    u.pitch = 1.2;
    window.speechSynthesis.speak(u);
  }
}

function bunyiTepukTangan() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  for (let i = 0; i < 18; i++) {
    const waktu = audioCtx.currentTime + i * 0.11;
    const bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 1000 + Math.random() * 500;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.3, waktu);
    gain.gain.exponentialRampToValueAtTime(0.01, waktu + 0.08);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(waktu);
  }
}

function mulaiKuis(m) {
  daftarSoal = DB[anakAktif][m];
  indeks = 0; skorPG = 0; totalPG = daftarSoal.filter(s => s.t === 'pg').length;
  document.getElementById('menu-mapel').classList.add('hidden');
  document.getElementById('area-kuis').classList.remove('hidden');
  tampilkanSoal();
}
function tampilkanSoal() {
  const s = daftarSoal[indeks];
  document.getElementById('info-soal').innerText = `Soal ${indeks + 1} / ${daftarSoal.length}`;
  document.getElementById('teks-soal').innerText = s.q;
  document.getElementById('status-jawaban').innerHTML = '';
  document.getElementById('wadah-pembahasan').classList.add('hidden');
  document.getElementById('tombol-lanjut').classList.add('hidden');
  const wOpsi = document.getElementById('wadah-opsi'), wEsai = document.getElementById('wadah-esai'), badge = document.getElementById('badge-tipe');
  if (s.t === 'pg') {
    badge.innerText = 'Pilihan Ganda'; wOpsi.classList.remove('hidden'); wEsai.classList.add('hidden'); wOpsi.innerHTML = '';
    const huruf = ['A. ', 'B. ', 'C. ', 'D. '];
    s.o.forEach((teks, i) => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-opt'; btn.innerText = huruf[i] + teks;
      btn.onclick = () => cekPG(i, btn);
      wOpsi.appendChild(btn);
    });
  } else {
    badge.innerText = 'Soal Esai (Uraian)'; wOpsi.classList.add('hidden'); wEsai.classList.remove('hidden');
    const inp = document.getElementById('input-jawaban-esai');
    inp.value = ''; inp.disabled = false; inp.style.borderColor = '#118ab2'; inp.style.background = 'white';
    document.getElementById('tombol-cek-esai').classList.remove('hidden');
  }
  window.scrollTo(0, 0);
}
function cekPG(pilihan, btnPilih) {
  const s = daftarSoal[indeks];
  document.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);
  const st = document.getElementById('status-jawaban'), box = document.getElementById('wadah-pembahasan');
  if (pilihan === s.j) {
    btnPilih.style.background = '#d8f3dc'; btnPilih.style.borderColor = '#06d6a0';
    st.innerHTML = '<div style="font-size:42px; margin-top:8px;">🥳</div><div class="benar-text">Yeah!!! Jawabanmu Betul!</div>';
    skorPG++;
    bunyiNada(new Array(523, 659, 784, 1046), 0.25);
    bicara('Yeah! Hebat!');
    setTimeout(() => { soalBerikutnya(); }, 1300);
  } else {
    btnPilih.style.background = '#ffe5ec'; btnPilih.style.borderColor = '#ef476f';
    const semua = document.querySelectorAll('.btn-opt');
    semua[s.j].style.background = '#d8f3dc'; semua[s.j].style.borderColor = '#06d6a0';
    st.innerHTML = '<div style="font-size:42px; margin-top:8px;">😢</div><div class="salah-text">Yahhh salah nih... Yuk baca pembahasannya!</div>';
    bunyiNada(new Array(350, 280, 210), 0.3, 'sawtooth');
    bicara('Yahhh, salah nih!');
    box.innerHTML = `<strong>💡 Pembahasan:</strong>\n${s.b}`; box.classList.remove('hidden');
    document.getElementById('tombol-lanjut').classList.remove('hidden');
  }
}
function cekJawabanEsai() {
  const s = daftarSoal[indeks], inp = document.getElementById('input-jawaban-esai');
  if (inp.value.trim() === '') { alert('Ketik dulu jawabannya ya!'); return; }
  inp.disabled = true; document.getElementById('tombol-cek-esai').classList.add('hidden');
  document.getElementById('status-jawaban').innerHTML = '<div class="info-esai-text">✅ Jawaban tersimpan! Yuk cocokan dengan kunci di bawah:</div>';
  bunyiNada(new Array(523, 659), 0.2);
  const box = document.getElementById('wadah-pembahasan');
  box.innerHTML = `<strong>🔑 Kunci Jawaban / Pembahasan:</strong>\n${s.b}`; box.classList.remove('hidden');
  document.getElementById('tombol-lanjut').classList.remove('hidden');
}
function soalBerikutnya() {
  indeks++;
  if (indeks < daftarSoal.length) tampilkanSoal();
  else {
    document.getElementById('area-kuis').classList.add('hidden');
    document.getElementById('area-hasil').classList.remove('hidden');
    document.getElementById('teks-skor').innerText = `Pilihan Ganda: Benar ${skorPG} dari ${totalPG} soal ⭐`;
    bunyiTepukTangan();
    bicara('Horeee selesai! Hebat sekali!');
  }
}

}
</script>
</body>
</html>
