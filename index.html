<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpiade Anak - Zio & Eca</title>
  <link rel="icon" type="image/png" href="ikon_aplikasi_juara.png">
  <link rel="apple-touch-icon" href="ikon_aplikasi_juara.png">
  <link rel="manifest" href="manifest.json">
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #e0f7fa; text-align: center; padding: 15px; margin: 0; color: #333; }
  .card { background: white; max-width: 520px; margin: 10px auto; padding: 20px; border-radius: 22px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
  h1 { color: #ff6b6b; font-size: 23px; margin-bottom: 5px; }
  h2 { color: #118ab2; font-size: 20px; }
  .btn { display: block; width: 100%; padding: 14px; margin: 10px 0; font-size: 17px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn-tk { background: #ffd166; color: #333; }
  .btn-sd { background: #06d6a0; color: white; }
  .btn-mapel { background: #118ab2; color: white; }
  .btn-paket { background: #4ea8de; color: white; }
  .btn-opt { background: #f8f9fa; color: #073b4c; border: 2px solid #118ab2; text-align: left; padding: 12px 16px; font-size: 16px; }
  .btn-cek { background: #06d6a0; color: white; margin-top: 12px; }
  .btn-next { background: #ff9f1c; color: white; margin-top: 15px; }
  .btn-back { background: #adb5bd; color: white; font-size: 15px; padding: 10px; margin-top: 20px; }
  .question { font-size: 18px; margin: 15px 0; color: #073b4c; font-weight: bold; line-height: 1.45; text-align: left; white-space: pre-line; }
  .input-esai { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #118ab2; border-radius: 15px; text-align: left; outline: none; font-family: inherit; resize: vertical; }
  .box-pembahasan { background: #fff3cd; border-left: 5px solid #ffca2c; padding: 12px; margin-top: 15px; border-radius: 10px; text-align: left; font-size: 15px; line-height: 1.45; white-space: pre-line; }
  .benar-text { color: #06d6a0; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .salah-text { color: #ef476f; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .info-esai-text { color: #118ab2; font-weight: bold; font-size: 18px; margin-top: 12px; }
  .badge-tipe { display: inline-block; background: #e0fbfc; color: #118ab2; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
  .hidden { display: none; }
  .match-wrap { position: relative; display: flex; justify-content: space-between; margin: 15px 0; user-select: none; }
  .match-col { display: flex; flex-direction: column; gap: 14px; width: 42%; z-index: 2; }
  .match-box { background: #fffbeb; border: 3px solid #fbbf24; border-radius: 14px; padding: 12px; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .match-box.kanan { background: #f0fdf4; border-color: #4ade80; flex-direction: row-reverse; font-size: 18px; }
  .match-box.pilih { box-shadow: 0 0 0 4px #ff6b6b; transform: scale(1.04); }
  .match-box.cocok { background: #dcfce7; border-color: #22c55e; opacity: 0.85; cursor: default; }
  .titik { width: 14px; height: 14px; background: #ff6b6b; border-radius: 50%; display: inline-block; }
  .match-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
</style>
</head>

<div class="card" id="popup-awal" style="padding: 35px 20px;">
  <div style="font-size: 55px; margin-bottom: 10px;">🎒📚</div>
  <h1>Sudah siap bermain?</h1>
  <p style="color:#666; margin-bottom: 20px;">Ayo bermain soal olimpiade hari ini!</p>
  <button class="btn btn-sd" style="font-size: 20px; padding: 16px;" onclick="mulaiSapaan()">Siap! 🚀</button>
</div>

<div class="card hidden" id="menu-anak">
  <h1>🏆 Bermainn Olimpiade 🏆</h1>
  <p>Siapakah yang akan bermain saat ini?</p>
  <button class="btn btn-tk" onclick="pilihAnak('TK', 'Zio')">🐯 ZIO (Level TK)</button>
  <button class="btn btn-sd" onclick="pilihAnak('SD', 'Eca')">🐔 ECA (SD Kelas 1-2)</button>
</div>

<div class="card hidden" id="menu-mapel">
  <h2 id="judul-anak"></h2>
  <p>Pilih mata pelajaran:</p>
  <button class="btn btn-mapel" onclick="pilihMapel('MTK')">🔢 Matematika & Logika</button>
  <button class="btn btn-mapel" onclick="pilihMapel('IPA')">🌿 Sains / IPA</button>
  <button class="btn btn-mapel" onclick="pilihMapel('ING')">🔤 Bahasa Inggris</button>
  <button class="btn btn-back" onclick="kembaliKeAnak()">⬅ Ganti Profil</button>
</div>

<div class="card hidden" id="menu-paket">
  <h2 id="judul-mapel"></h2>
  <p>Pilih paket soal latihan:</p>
  <div id="wadah-paket"></div>
  <button class="btn btn-back" onclick="kembaliKeMapel()">⬅ Pilih Pelajaran Lain</button>
</div>

<div class="card hidden" id="area-kuis">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <button onclick="keMenuPaket()" style="background:#eee; border:none; padding:6px 14px; border-radius:10px; font-weight:bold; color:#555; cursor:pointer;">Menu</button>
    <div id="info-soal" style="color: #888; font-weight: bold; font-size: 14px;"></div>
    <button onclick="keSoalSebelumnya()" style="background:#eee; border:none; padding:6px 14px; border-radius:10px; font-weight:bold; color:#555; cursor:pointer;">Back</button>
  </div>
  <div id="badge-tipe" class="badge-tipe"></div>
  <div class="question" id="teks-soal"></div>
  <div id="wadah-opsi"></div>
  <div id="wadah-garis" class="hidden"></div>
  <div id="wadah-esai" class="hidden">
    <textarea id="input-jawaban-esai" class="input-esai" rows="4" placeholder="Ketik jawabanmu di sini..."></textarea>
    <button id="tombol-cek-esai" class="btn btn-cek" onclick="cekJawabanEsai()">Lihat Kunci & Pembahasan ✔</button>
  </div>
  <div id="status-jawaban"></div>
  <div id="wadah-pembahasan" class="box-pembahasan hidden"></div>
  <button id="tombol-lanjut" class="btn btn-next hidden" onclick="soalBerikutnya()">Soal Berikutnya ➡</button>
</div>

<div class="card hidden" id="area-hasil">
  <h1>🎉 Horeee Selesai! 🎉</h1>
  <p id="teks-skor" style="font-size: 20px; font-weight: bold; color: #118ab2;"></p>
  <button class="btn btn-sd" onclick="keMenuPaket()">Pilih Paket Soal Lain</button>
  <button class="btn btn-back" onclick="kembaliKeAnak()">Ganti Profil Anak</button>
</div>

        {t:'pg', q:'13. Budi berdiri di bawah sinar matahari dan melihat bayangannya di tanah. Ketika Budi berpindah ke tempat yang teduh, bayangannya menjadi kurang jelas. Penyebabnya adalah ....', o:['Bayangan membutuhkan cahaya dan benda yang menghalangi cahaya','Bayangan merupakan benda hidup','Bayangan dapat bergerak sendiri','Bayangan berasal dari tanah'], j:0, b:'Bayangan terbentuk dengan jelas apabila ada sumber cahaya terang yang terhalang oleh benda tidak tembus cahaya.'},
        {t:'pg', q:'14. Ani memiliki tiga benda: kaca bening, karton, dan plastik buram. Ia ingin melihat gambar yang berada di balik salah satu benda tersebut dengan jelas. Benda yang sebaiknya dipilih adalah ....', o:['Karton','Plastik buram','Kaca bening','Semua benda sama'], j:2, b:'Kaca bening bersifat tembus cahaya (transparan) sehingga gambar di baliknya dapat terlihat dengan jelas.'},
        {t:'pg', q:'15. Pada siang hari, bayangan tiang terlihat lebih pendek dibandingkan bayangan pada pagi atau sore hari dalam kondisi tertentu. Hal ini berkaitan dengan ....', o:['Perubahan posisi semu matahari di langit','Tiang semakin pendek','Tanah semakin tinggi','Cahaya matahari menghilang'], j:0, b:'Posisi matahari yang tampak tinggi tepat di atas pada siang hari membuat bayangan benda menjadi lebih pendek dibanding saat matahari rendah di pagi atau sore hari.'},
        {t:'pg', q:'16. Raka melihat Bulan pada malam hari. Beberapa malam kemudian, bentuk Bulan yang terlihat berbeda. Kesimpulan yang tepat adalah ....', o:['Bulan berubah menjadi benda lain','Bentuk bagian Bulan yang terkena cahaya matahari dan terlihat dari Bumi berubah','Bulan mati pada malam tertentu','Bulan menghasilkan cahaya yang semakin besar'], j:1, b:'Bentuk Bulan tampak berubah-ubah (fase bulan) karena perubahan posisi Bulan saat mengelilingi Bumi sehingga bagian yang memantulkan cahaya matahari terlihat berbeda.'},
        {t:'pg', q:'17. Jika Matahari tiba-tiba tidak memberikan cahaya kepada Bumi, keadaan yang paling mungkin terjadi adalah ....', o:['Bumi menjadi lebih terang','Bumi menjadi gelap','Bintang berhenti ada','Bulan berubah menjadi Matahari'], j:1, b:'Matahari adalah sumber cahaya utama bagi Bumi. Tanpa cahaya Matahari, seluruh Bumi akan menjadi gelap gulita dan dingin.'},
        {t:'pg', q:'18. Bumi berputar pada porosnya. Ketika Indonesia mengalami siang hari, beberapa wilayah di bagian lain Bumi dapat mengalami malam hari. Mengapa hal tersebut terjadi?', o:['Bumi memiliki bagian yang menghadap Matahari dan bagian yang membelakanginya','Matahari hanya menyinari Indonesia','Bulan menutupi seluruh Bumi','Matahari mengelilingi Indonesia'], j:0, b:'Karena bentuk Bumi bulat dan berputar pada porosnya (rotasi), sisi yang menghadap Matahari mengalami siang, sedangkan sisi sebaliknya mengalami malam.'},
        {t:'pg', q:'19. Perhatikan hasil pengamatan berikut: Ikan bergerak dan membutuhkan makanan; batu tidak tumbuh; pohon tumbuh dan membutuhkan air; sepeda bergerak jika dikayuh. Berdasarkan pengamatan tersebut, pasangan makhluk hidup adalah ....', o:['Ikan dan pohon','Batu dan sepeda','Ikan dan sepeda','Pohon dan batu'], j:0, b:'Ikan dan pohon menunjukkan ciri makhluk hidup seperti tumbuh, bergerak sendiri, dan membutuhkan makanan serta air.'},
        {t:'pg', q:'20. Lala ingin mengetahui apakah cahaya matahari memengaruhi pertumbuhan tanaman. Ia menyiapkan dua tanaman yang sama. Keduanya disiram dengan jumlah air yang sama. Tanaman A diletakkan di tempat terang, sedangkan tanaman B di tempat gelap. Hal yang harus diamati Lala adalah ....', o:['Warna dan pertumbuhan kedua tanaman','Harga kedua pot','Ukuran meja tempat tanaman diletakkan','Jumlah mainan di sekitar tanaman'], j:0, b:'Untuk melihat pengaruh cahaya matahari, Lala perlu mengamati perbedaan warna daun dan tinggi pertumbuhan kedua tanaman tersebut.'},
         {t:'pg', q:'21. Dalam percobaan, sebuah sendok logam dan sendok plastik dimasukkan ke dalam air hangat. Setelah beberapa saat, sendok logam terasa lebih hangat ketika disentuh pada bagian pegangannya. Kesimpulan yang paling tepat adalah ....', o:['Logam lebih mudah menghantarkan panas daripada plastik','Plastik menghasilkan api','Logam tidak dapat menerima panas','Air hangat berubah menjadi logam'], j:0, b:'Logam merupakan penghantar panas (konduktor) yang baik sehingga panas dari air hangat cepat merambat ke pegangan sendok.'},
        {t:'pg', q:'22. Tono ingin mengetahui benda mana yang paling cepat mengeringkan pakaian. Ia menjemur dua kain basah dengan ukuran sama. Kain A diletakkan di bawah matahari, sedangkan kain B diletakkan di tempat teduh. Agar percobaan adil, hal yang harus dibuat sama adalah ....', o:['Ukuran dan jumlah air pada kedua kain','Warna tempat menjemur saja','Nama kedua kain','Posisi rumah terhadap jalan'], j:0, b:'Dalam percobaan yang adil, faktor lain selain tempat menjemur harus dibuat sama, yaitu ukuran kain dan banyaknya air pada kain.'},
        {t:'pg', q:'23. Seorang anak mengamati bahwa tanaman yang diletakkan dekat jendela tumbuh condong ke arah datangnya cahaya. Penjelasan yang paling tepat adalah ....', o:['Tanaman dapat merespons arah datangnya cahaya','Tanaman ingin keluar dari pot','Tanaman dapat berjalan','Tanaman tidak membutuhkan cahaya'], j:0, b:'Makhluk hidup peka terhadap rangsangan. Batang tanaman merespons rangsangan cahaya matahari dengan tumbuh membengkok ke arah datangnya cahaya.'},
        {t:'pg', q:'24. (ENGLISH) Tom puts an ice cube under the hot sun. What will happen to the ice cube?', o:['It will become harder','It will melt','It will become a stone','It will disappear forever'], j:1, b:'"It will melt" artinya es batu akan mencair karena terkena panas terik matahari.'},
        {t:'pg', q:'25. (ENGLISH) Lisa sees a plant with yellow leaves and dry soil. What should she do first?', o:['Give the plant some water','Put the plant in a dark box','Cut all the roots','Cover the plant with plastic'], j:0, b:'Tanah kering (dry soil) dan daun menguning menandakan tanaman kekurangan air, sehingga Lisa harus menyiramnya (give the plant some water).'},
        {t:'esai', q:'ESAI 1. Rina menutup matanya dan diminta mengenali tiga benda: bunga, lonceng, dan es batu.\na. Indra apa yang digunakan untuk mengenali bunga?\nb. Indra apa yang digunakan untuk mengenali suara lonceng?\nc. Indra apa yang digunakan untuk merasakan dinginnya es batu?', b:'a. Indra penciuman (hidung) untuk mencium aroma bunga.\nb. Indra pendengaran (telinga) untuk mendengar bunyi lonceng.\nc. Indra peraba (kulit) untuk merasakan suhu dingin es batu.'},
        {t:'esai', q:'ESAI 2. Dua tanaman yang ukurannya sama diletakkan di tempat berbeda. Tanaman A mendapat air dan cahaya matahari, sedangkan tanaman B tidak mendapatkan air dan cahaya matahari. Setelah satu minggu, tanaman A tumbuh lebih baik daripada tanaman B. Jelaskan mengapa hal tersebut bisa terjadi!', b:'Karena tanaman membutuhkan air dan cahaya matahari untuk melakukan fotosintesis (membuat makanannya sendiri). Tanaman A mendapatkan keduanya sehingga tumbuh subur, sedangkan tanaman B tidak bisa membuat makanan sehingga pertumbuhannya terhambat dan layu.'},
        {t:'esai', q:'ESAI 3. Ibu memasukkan air ke dalam panci dan memanaskannya sampai mendidih.\na. Apa yang terjadi pada air ketika dipanaskan?\nb. Mengapa muncul uap?\nc. Apa yang akan terjadi jika uap air mengenai permukaan yang dingin?', b:'a. Suhu air naik hingga mendidih dan volumenya berkurang.\nb. Karena air menerima energi panas sehingga berubah wujud dari benda cair menjadi gas (menguap).\nc. Uap air akan mengalami pengembunan dan berubah kembali menjadi titik-titik air.'},
        {t:'esai', q:'ESAI 4. Pada pagi hari, seorang anak melihat bayangan pohon di tanah. Ketika awan tebal menutupi matahari, bayangan pohon menjadi kurang jelas. Mengapa bayangan pohon menjadi kurang jelas? Jelaskan!', b:'Karena awan tebal menghalangi sebagian besar cahaya matahari yang menuju ke pohon. Ketika cahaya yang datang berkurang atau redup, bayangan yang terbentuk menjadi samar dan kurang jelas.'},
        {t:'esai', q:'ESAI 5. Andi ingin mengetahui bahan yang paling baik menghantarkan panas. Ia memasukkan sendok logam dan sendok plastik ke dalam wadah berisi air hangat dengan kondisi yang sama. Setelah beberapa saat, sendok logam terasa lebih hangat.\na. Sendok manakah yang lebih baik menghantarkan panas?\nb. Apa bukti dari hasil percobaan tersebut?\nc. Apa kesimpulan yang dapat diambil Andi?', b:'a. Sendok logam.\nb. Buktinya adalah bagian pegangan sendok logam terasa lebih hangat saat disentuh dibandingkan sendok plastik.\nc. Kesimpulan: Logam merupakan bahan penghantar panas (konduktor) yang lebih baik daripada plastik.'}

<script>

function bicara(teks) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID'; u.rate = 1.0; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function bunyiNada(freqs, durasi, tipe = 'sine') {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = tipe;
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + idx * 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + durasi);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + idx * 0.12);
    osc.stop(audioCtx.currentTime + idx * 0.12 + durasi);
  });
}

function bunyiTepukTangan() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  for (let i = 0; i < 20; i++) {
    const waktu = audioCtx.currentTime + i * 0.1, bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
    for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1100 + Math.random() * 600;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.25, waktu);
    gain.gain.exponentialRampToValueAtTime(0.01, waktu + 0.07);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(waktu);
  }
}

 }

  paketAktif = namaPaket;

    });
  } else if (s.t === 'garis' || s.tipe === 'garis') {
    if (badge) badge.innerText = 'Tarik Garis (Hubungkan)';
    wGaris.classList.remove('hidden');
    buatSoalGaris(s, wGaris);
  } else {
    if (badge) badge.innerText = 'Soal Esai (Uraian)';
    wEsai.classList.remove('hidden');
    const inp = document.getElementById('input-jawaban-esai');
    inp.value = ''; inp.disabled = false; inp.style.borderColor = '#118ab2'; inp.style.background = '#fff';
    document.getElementById('tombol-cek-esai').classList.remove('hidden');
  }
  window.scrollTo(0, 0);
}

let pilihKiri = null, jumlahCocok = 0;
function buatSoalGaris(s, wadah) {
  pilihKiri = null; jumlahCocok = 0;
  const kananAcak = [...s.pasang].map((item, idx) => ({ ...item, idAsli: idx })).sort(() => Math.random() - 0.5);
  wadah.innerHTML = '<div id="area-match" style="position:relative; display:flex; justify-content:space-between; gap:45px; margin:15px 0;">' +
    '<svg id="svg-garis" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:10;"></svg>' +
    '<div id="kol-kiri" style="flex:1; display:flex; flex-direction:column; gap:12px; z-index:2;"></div>' +
    '<div id="kol-kanan" style="flex:1; display:flex; flex-direction:column; gap:12px; z-index:2;"></div>' +
    '</div>';
  const colKiri = document.getElementById('kol-kiri');
  const colKanan = document.getElementById('kol-kanan');

  s.pasang.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'match-box'; div.id = 'kiri-' + idx;
    div.style.cssText = 'display:flex; align-items:center; justify-content:space-between; padding:12px; border:2px solid #cbd5e1; border-radius:12px; background:#fff; cursor:pointer; font-size:20px;';
    div.innerHTML = '<span>' + item.kiri + '</span><span class="titik" style="width:14px; height:14px; border-radius:50%; background:#1e293b; display:inline-block;"></span>';
    div.onclick = () => {
      if (div.classList.contains('cocok')) return;
      document.querySelectorAll('#kol-kiri .match-box').forEach(el => { el.classList.remove('pilih'); el.style.borderColor = '#cbd5e1'; });
      div.classList.add('pilih'); div.style.borderColor = '#3b82f6';
      pilihKiri = { idx, el: div, warna: item.warna };
    };
    colKiri.appendChild(div);
  });

  kananAcak.forEach(item => {
    const div = document.createElement('div');
    div.className = 'match-box kanan'; div.id = 'kanan-' + item.idAsli;
    div.style.cssText = 'display:flex; align-items:center; justify-content:space-between; padding:12px; border:2px solid #cbd5e1; border-radius:12px; background:#fff; cursor:pointer; font-size:22px; font-weight:bold;';
    div.innerHTML = '<span class="titik" style="width:14px; height:14px; border-radius:50%; background:#1e293b; display:inline-block;"></span><span>' + item.kanan + '</span>';
    div.onclick = () => {
      if (!pilihKiri || div.classList.contains('cocok')) return;
      const st = document.getElementById('status-jawaban');
      if (pilihKiri.idx === item.idAsli) {
        pilihKiri.el.classList.remove('pilih');
        pilihKiri.el.classList.add('cocok'); pilihKiri.el.style.borderColor = '#06d6a0'; pilihKiri.el.style.background = '#d8f3dc';
        div.classList.add('cocok'); div.style.borderColor = '#06d6a0'; div.style.background = '#d8f3dc';
        gambarGarisSVG(pilihKiri.el, div, pilihKiri.warna);
        bunyiNada(new Array(523, 784), 0.2);
        pilihKiri = null; jumlahCocok++;
        if (jumlahCocok === s.pasang.length) {
          st.innerHTML = '<div style="font-size:42px; margin-top:8px;">🎉</div><div class="benar-text">Yeah!! Semua Garis Benar!</div>';
          skorPG++; bunyiNada(new Array(523, 659, 784, 1046), 0.25); bicara('Yeah! Hebat!');
          setTimeout(() => { soalBerikutnya(); }, 1500);
        }
      } else {
        if (!daftarSalah.some(x => x.no === indeks + 1)) {
          daftarSalah.push({ no: indeks + 1, soal: s.q, jawabAnak: 'Salah memasangkan garis', kunci: s.b, bahas: s.b });
        }
        bunyiNada(new Array(300, 220), 0.25, 'sawtooth');
        bicara('Yahhh, lebih teliti yuk! Coba pasangan lain!');
        st.innerHTML = '<div class="salah-text">😢 Belum pas, lebih teliti yuk!</div>';
        setTimeout(() => { if (jumlahCocok < s.pasang.length) st.innerHTML = ''; }, 1200);
      }
    };
    colKanan.appendChild(div);
  });
}

function gambarGarisSVG(elKiri, elKanan, warna) {
  const area = document.getElementById('area-match').getBoundingClientRect();
  const svg = document.getElementById('svg-garis');
  const r1 = elKiri.querySelector('.titik').getBoundingClientRect();
  const r2 = elKanan.querySelector('.titik').getBoundingClientRect();
  const line = document.createElementNS('http://w3.org', 'line');
  line.setAttribute('x1', r1.left - area.left + 7);
  line.setAttribute('y1', r1.top - area.top + 7);
  line.setAttribute('x2', r2.left - area.left + 7);
  line.setAttribute('y2', r2.top - area.top + 7);
  line.setAttribute('stroke', warna || '#1e293b');
  line.setAttribute('stroke-width', '4');
  line.setAttribute('stroke-linecap', 'round');
  svg.appendChild(line);
}
 
function cekPG(pilihan, btnPilih) {
  const s = daftarSoal[indeks];
  document.querySelectorAll('.btn-opt').forEach(b => b.disabled = true);
  const st = document.getElementById('status-jawaban'), box = document.getElementById('wadah-pembahasan');
  if (pilihan === s.j) {
    btnPilih.style.background = '#d8f3dc'; btnPilih.style.borderColor = '#06d6a0';
    skorPG++; streakBenar++;
    var teksPujian = "Yeah!! Jawabanmu Betul!";
    var suaraPujian = "Yeah! Betul!";
    var emojiPujian = "🎉";
    if (streakBenar >= 6) {
      teksPujian = "Mantap!!! Ini dia calon juara!!";
      suaraPujian = "Mantap! Ini dia calon juara!";
      emojiPujian = "🏆🔥";
    } else if (streakBenar >= 3) {
      teksPujian = "Waow good job! Hebat!! Kamu luar biasa!!";
      suaraPujian = "Waow good job! Hebat! Kamu luar biasa!";
      emojiPujian = "🌟👏";
    }
    st.innerHTML = '<div style="font-size:42px; margin-top:8px;">' + emojiPujian + '</div><div class="benar-text">' + teksPujian + '</div>';
    bunyiNada(new Array(523, 659, 784, 1046), 0.25);
    bicara(suaraPujian);
    setTimeout(() => { soalBerikutnya(); }, 1500);
  } else {
    streakBenar = 0;
    if (!daftarSalah.some(x => x.no === indeks + 1)) {
      daftarSalah.push({ no: indeks + 1, soal: s.q, jawabAnak: s.o[pilihan], kunci: s.o[s.j], bahas: s.b });
    }
    btnPilih.style.background = '#ffe5ec'; btnPilih.style.borderColor = '#ef476f';
    const semua = document.querySelectorAll('.btn-opt');
    if (semua[s.j]) { semua[s.j].style.background = '#d8f3dc'; semua[s.j].style.borderColor = '#06d6a0'; }
    st.innerHTML = '<div style="font-size:42px; margin-top:8px;">😢</div><div class="salah-text">Yahhh salah nih... Yuk baca pembahasannya!</div>';
    bunyiNada(new Array(350, 280, 210), 0.3, 'sawtooth'); bicara('Yahhh, salah nih!');
    box.innerHTML = '<strong>💡 Pembahasan:</strong>\n' + s.b; box.classList.remove('hidden');
    document.getElementById('tombol-lanjut').classList.remove('hidden');
  }
}

function cekJawabanEsai() {
  const s = daftarSoal[indeks], inp = document.getElementById('input-jawaban-esai');
  const jawabanAnak = inp.value.trim();
  if (jawabanAnak === '') { alert('Ketik dulu jawabannya ya!'); return; }
  
  inp.disabled = true;
  document.getElementById('tombol-cek-esai').classList.add('hidden');
  document.getElementById('status-jawaban').innerHTML = '<div class="info-esai-text">✅ Jawaban tersimpan! Cocokkan dengan kunci di bawah lalu pilih hasilnya:</div>';
  bunyiNada(new Array(523, 659), 0.2);

  const box = document.getElementById('wadah-pembahasan');
  box.innerHTML = '<strong>🔑 Kunci Jawaban / Pembahasan:</strong>\n' + s.b +
    '<div style="display:flex; gap:10px; margin-top:14px;">' +
    '<button onclick="nilaiEsaiMandiri(true)" style="flex:1; padding:12px; background:#06d6a0; color:#fff; border:none; border-radius:12px; font-weight:bold; font-size:15px;">✅ Betul / Sesuai</button>' +
    '<button onclick="nilaiEsaiMandiri(false)" style="flex:1; padding:12px; background:#ef476f; color:#fff; border:none; border-radius:12px; font-weight:bold; font-size:15px;">❌ Belum Tepat</button>' +
    '</div>';
  box.classList.remove('hidden');
}

function nilaiEsaiMandiri(isBenar) {
  const s = daftarSoal[indeks];
  const jawabanAnak = document.getElementById('input-jawaban-esai').value.trim();
  totalPG++;
  if (isBenar) {
    skorPG++;
    streakBenar++;
    bunyiNada(new Array(523, 659, 784, 1046), 0.25);
    bicara('Hebat! Jawaban esaimu sesuai!');
  } else {
    streakBenar = 0;
    if (!daftarSalah.some(x => x.no === indeks + 1)) {
      daftarSalah.push({ no: indeks + 1, soal: s.q, jawabAnak: jawabanAnak, kunci: s.b, bahas: 'Perhatikan poin penting pada kunci jawaban.' });
    }
    bunyiNada(new Array(350, 280, 210), 0.3, 'sawtooth');
    bicara('Tidak apa-apa, pelajari lagi ya!');
  }
  soalBerikutnya();
}

function soalBerikutnya() {
  indeks++;
  if (indeks < daftarSoal.length) {
    tampilkanSoal();
  } else {
    if (intervalTimer) clearInterval(intervalTimer);
    document.getElementById('area-kuis').classList.add('hidden');
    document.getElementById('area-hasil').classList.remove('hidden');

    var totalDetik = Math.floor((Date.now() - waktuMulai) / 1000);
    var menit = Math.floor(totalDetik / 60);
    var detik = totalDetik % 60;
    var teksWaktu = (menit > 0 ? menit + " menit " : "") + detik + " detik";
    var statusBatas = totalDetik <= 3600 ? "✅ Selesai tepat waktu (di bawah 60 menit)" : "⚠️ Melewati batas 60 menit";
    var nilai = totalPG > 0 ? Math.round((skorPG / totalPG) * 100) : 100;

    var namaAnakTampil = anakAktif === 'TK' ? 'Zio (TK)' : 'Eca (SD)';
    var catatanBaru = {
      tanggal: new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }),
      jam: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
      anak: namaAnakTampil,
      mapel: mapelAktif,
      paket: paketAktif,
      waktu: teksWaktu,
      nilai: nilai,
      salah: daftarSalah.map(function(item) { return { soal: item.soal, kunci: item.kunci }; })
    };
    var semuaCatatan = JSON.parse(localStorage.getItem('catatanBelajarAnak') || '[]');
    semuaCatatan.unshift(catatanBaru);
    localStorage.setItem('catatanBelajarAnak', JSON.stringify(semuaCatatan));

    var htmlHasil = '<div style="background:#f0f9ff; border:2px solid #118ab2; border-radius:16px; padding:15px; margin:12px 0;">';
    htmlHasil += '<div style="font-size:15px; color:#555;">Nilai Akhir Ujian:</div>';
    htmlHasil += '<div style="font-size:48px; font-weight:bold; color:#06d6a0; line-height:1.2;">' + nilai + '</div>';
    htmlHasil += '<div style="font-size:15px; color:#333;">Benar ' + skorPG + ' dari ' + totalPG + ' soal ⭐</div>';
    htmlHasil += '<div style="font-size:14px; color:#118ab2; font-weight:bold; margin-top:8px;">⏱️ Waktu pengerjaan: ' + teksWaktu + '</div>';
    if (anakAktif === 'SD') {
      htmlHasil += '<div style="font-size:13px; color:#555; margin-top:3px;">' + statusBatas + '</div>';
    }
    htmlHasil += '</div>';

    if (daftarSalah.length > 0) {
      daftarSalah.sort(function(a, b) { return a.no - b.no; });
      htmlHasil += '<div style="text-align:left; margin-top:15px;"><b style="color:#ef476f; font-size:17px;">❌ Evaluasi Soal yang Salah (' + daftarSalah.length + ' soal):</b>';
      daftarSalah.forEach(function(item) {
        htmlHasil += '<div style="background:#fff5f7; border-left:4px solid #ef476f; border-radius:10px; padding:12px; margin-top:10px; font-size:14px; line-height:1.45; color:#222;">';
        htmlHasil += '<b>' + item.soal + '</b><br>';
        htmlHasil += '<span style="color:#d90429;">❌ Jawabanmu: ' + item.jawabAnak + '</span><br>';
        htmlHasil += '<span style="color:#007f5f;">✅ Kunci Benar: ' + item.kunci + '</span><br>';
        htmlHasil += '<span style="color:#555;">💡 ' + item.bahas + '</span></div>';
      });
      htmlHasil += '</div>';
    } else {
      htmlHasil += '<div style="margin-top:15px; padding:14px; background:#d8f3dc; color:#007f5f; border-radius:12px; font-size:16px;">🌟 Sempurna! Tidak ada soal yang salah!</div>';
    }
    document.getElementById('teks-skor').innerHTML = htmlHasil;
    bunyiTepukTangan(); bicara('Horeee selesai! Nilaimu ' + nilai + '!');
  }
}

function bukaCatatanBelajar() {
  var semua = JSON.parse(localStorage.getItem('catatanBelajarAnak') || '[]');
  var modal = document.getElementById('modal-catatan-belajar');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal-catatan-belajar';
    modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; overflow-y:auto; padding:16px; box-sizing:border-box;';
    document.body.appendChild(modal);
  }

  var isi = '<div style="background:#fff; max-width:500px; margin:20px auto; border-radius:20px; padding:20px; text-align:left; font-family:sans-serif;">';
  isi += '<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #f1f5f9; padding-bottom:10px;">';
  isi += '<h3 style="margin:0; color:#118ab2;">📋 Catatan Hasil Belajar</h3>';
  isi += '<button onclick="document.getElementById(\'modal-catatan-belajar\').style.display=\'none\'" style="background:#ef476f; color:#fff; border:none; border-radius:10px; padding:6px 12px; font-weight:bold; cursor:pointer;">Tutup</button>';
  isi += '</div>';

  if (semua.length === 0) {
    isi += '<p style="text-align:center; color:#64748b; padding:20px 0;">Belum ada catatan ujian yang tersimpan.</p>';
  } else {
    semua.forEach(function(c) {
      isi += '<div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:12px; margin-top:12px; font-size:14px;">';
      isi += '<div style="font-size:12px; color:#64748b;">📅 ' + c.tanggal + ' • Jam ' + c.jam + '</div>';
      isi += '<div style="font-weight:bold; color:#0f172a; margin-top:4px;">👤 ' + c.anak + ' | ' + c.mapel + ' - ' + c.paket + '</div>';
      isi += '<div style="margin-top:4px; color:#0284c7; font-weight:bold;">🏆 Nilai: ' + c.nilai + ' &nbsp;|&nbsp; ⏱️ Waktu: ' + c.waktu + '</div>';
      if (c.salah && c.salah.length > 0) {
        isi += '<div style="margin-top:6px; color:#dc2626; font-size:13px;"><b>❌ Soal yang salah:</b><ul style="margin:4px 0 0 16px; padding:0;">';
        c.salah.forEach(function(s) {
          isi += '<li style="margin-bottom:4px;">' + s.soal + '<br><span style="color:#059669;">✔️ Kunci: ' + s.kunci + '</span></li>';
        });
        isi += '</ul></div>';
      } else {
        isi += '<div style="margin-top:6px; color:#059669; font-size:13px; font-weight:bold;">🌟 Benar semua! Tidak ada yang salah.</div>';
      }
      isi += '</div>';
    });
    isi += '<button onclick="if(confirm(\'Hapus semua catatan belajar?\')){localStorage.removeItem(\'catatanBelajarAnak\'); bukaCatatanBelajar();}" style="margin-top:16px; width:100%; background:#e2e8f0; color:#475569; border:none; border-radius:10px; padding:10px; font-size:13px; cursor:pointer;">🗑️ Hapus Semua Riwayat</button>';
  }

  isi += '</div>';
  modal.innerHTML = isi;
  modal.style.display = 'block';
}

(function tambahTombolCatatan() {
  var menuAnak = document.getElementById('menu-anak');
  if (menuAnak && !document.getElementById('btn-buka-catatan')) {
    var btn = document.createElement('button');
    btn.id = 'btn-buka-catatan';
    btn.className = 'btn';
    btn.style.cssText = 'background:#f59e0b; color:#fff; margin-top:15px; width:100%;';
    btn.innerText = '📋 Lihat Catatan Belajar Anak';
    btn.onclick = bukaCatatanBelajar;
    menuAnak.appendChild(btn);
  }
})();
</script>
