        {t:'esai', q:'23. A clock shows exactly 03.00 o\'clock. What kind of angle is formed by the two hands of the clock? (Acute, Right, or Obtuse angle?)', b:'Right angle (sudut siku-siku, besarnya 90 derajat).'},
        {t:'esai', q:'24. Sebuah bus mula-mula berisi 8 orang penumpang. Di halte A, turun 3 orang dan naik 5 orang. Di halte B, turun 4 orang. Berapa banyak penumpang di dalam bus sekarang?', b:'8 - 3 + 5 - 4 = 6 orang penumpang.'},
        {t:'esai', q:'25. Perhatikan gambar mental pola susunan segitiga: Pola 1 butuh 3 batang korek api. Pola 2 butuh 5 batang korek api. Pola 3 butuh 7 batang korek api. Berapa batang korek api yang dibutuhkan untuk membuat Pola ke-5?', b:'Pola bertambah +2 setiap langkah: Pola 4 butuh 9 batang, Pola 5 butuh 11 batang korek api.'}
      ]
    },
    ING: { "Paket 1": [{t:'pg', q:'Today is Monday. Tomorrow is ...', o:['Sunday','Tuesday','Friday'], j:1, b:'Setelah Senin (Monday) adalah Selasa (Tuesday).'}] },
    IPA: {
      "Paket 1 - Bermain Sains": [
        {t:'pg', q:'1. Ketika kita mencium aroma bunga, bagian tubuh yang digunakan adalah ....', o:['Mata','Hidung','Telinga','Lidah'], j:1, b:'Hidung adalah indra penciuman.'},
        {t:'pg', q:'2. Rina melihat warna pelangi setelah hujan. Indra yang digunakan Rina adalah ....', o:['Peraba','Pengecap','Penglihatan','Pendengaran'], j:2, b:'Mata adalah indra penglihatan.'},
        {t:'pg', q:'3. Bagian tubuh yang membantu kita merasakan rasa makanan adalah ....', o:['Kulit','Lidah','Hidung','Gigi'], j:1, b:'Lidah adalah indra pengecap.'},
        {t:'pg', q:'4. Berikut ini yang merupakan ciri-ciri makhluk hidup adalah ....', o:['Tidak membutuhkan makanan','Tidak dapat bergerak','Tumbuh dan berkembang','Tidak membutuhkan air'], j:2, b:'Makhluk hidup tumbuh, berkembang, bernapas, dan butuh makan/minum.'},
        {t:'pg', q:'5. Tanaman yang diletakkan di tempat gelap dalam waktu lama akan mengalami kesulitan tumbuh karena kekurangan ....', o:['Cahaya','Batu','Pasir','Plastik'], j:0, b:'Tanaman butuh cahaya matahari untuk fotosintesis.'},
        {t:'pg', q:'6. Seekor kucing melahirkan anak kucing. Hal tersebut menunjukkan bahwa makhluk hidup dapat ....', o:['Menguap','Berkembang biak','Membeku','Mencair'], j:1, b:'Berkembang biak artinya menghasilkan keturunan.'},
        {t:'pg', q:'7. Ketika lampu dinyalakan, ruangan menjadi terang. Perubahan energi yang terjadi adalah ....', o:['Energi listrik menjadi energi cahaya','Energi panas menjadi energi gerak','Energi bunyi menjadi energi listrik','Energi cahaya menjadi energi makanan'], j:0, b:'Lampu mengubah energi listrik menjadi cahaya.'},
        {t:'pg', q:'8. Alat berikut yang mengubah energi listrik menjadi energi gerak adalah ....', o:['Setrika','Kipas angin','Lampu','Lilin'], j:1, b:'Baling-baling kipas angin bergerak menggunakan listrik.'},
        {t:'pg', q:'9. Saat kita berlari, tubuh memperoleh energi dari ....', o:['Makanan','Batu','Plastik','Kertas'], j:0, b:'Makanan diolah tubuh menjadi energi.'},
        {t:'pg', q:'10. Ibu menjemur pakaian basah di bawah sinar matahari. Pakaian menjadi kering karena air mengalami ....', o:['Pembekuan','Penguapan','Pencairan','Pembusukan'], j:1, b:'Panas matahari membuat air menguap menjadi uap air.'},
        {t:'pg', q:'11. Air yang dimasukkan ke dalam freezer dalam waktu cukup lama akan berubah menjadi ....', o:['Uap','Es','Udara','Minyak'], j:1, b:'Air membeku menjadi es di suhu dingin.'},
        {t:'pg', q:'12. Sumber cahaya alami terbesar bagi bumi adalah ....', o:['Lampu','Lilin','Matahari','Senter'], j:2, b:'Matahari adalah sumber cahaya alami terbesar.'},
        {t:'pg', q:'13. Benda yang dapat menghasilkan bayangan ketika terkena cahaya adalah ....', o:['Benda bening','Benda yang menghalangi cahaya','Udara','Cahaya itu sendiri'], j:1, b:'Bayangan muncul saat cahaya terhalang benda tidak tembus cahaya.'},
        {t:'pg', q:'14. Ketika tangan didekatkan ke api unggun, tangan terasa hangat. Hal ini menunjukkan bahwa api menghasilkan ....', o:['Bunyi','Panas','Air','Angin'], j:1, b:'Api menghasilkan energi panas.'},
        {t:'pg', q:'15. Pada siang hari, matahari tampak berada di langit. Pada malam hari, benda langit yang sering terlihat adalah ....', o:['Matahari dan pelangi','Bulan dan bintang','Awan dan matahari','Pelangi dan matahari'], j:1, b:'Bulan dan bintang terlihat pada malam hari.'},
        {t:'pg', q:'16. Bulan terlihat bersinar pada malam hari karena ....', o:['Bulan menghasilkan cahaya sendiri','Bulan memantulkan cahaya matahari','Bulan terbuat dari api','Bulan memiliki lampu'], j:1, b:'Bulan memantulkan cahaya dari matahari.'},
        {t:'pg', q:'17. Benda langit yang menjadi pusat tata surya adalah ....', o:['Bumi','Bulan','Matahari','Bintang'], j:2, b:'Matahari adalah pusat tata surya.'},
        {t:'pg', q:'18. Peristiwa siang dan malam terjadi karena ....', o:['Bumi berputar pada porosnya','Bulan mengelilingi matahari','Matahari mengelilingi bumi','Bintang berpindah tempat'], j:0, b:'Rotasi bumi menyebabkan siang dan malam.'},
        {t:'pg', q:'19. Perhatikan benda-benda berikut:\n- Batu\n- Kucing\n- Pohon mangga\n- Sepeda\n\nBenda yang termasuk makhluk hidup adalah ....', o:['Baju dan sepeda','Kucing dan pohon mangga','Batu dan pohon mangga','Sepeda dan kucing'], j:1, b:'Kucing (hewan) dan pohon mangga (tumbuhan) adalah makhluk hidup.'},
        {t:'pg', q:'20. Andi meletakkan dua tanaman yang sama. Tanaman A diberi air secara teratur, sedangkan tanaman B tidak diberi air. Setelah beberapa hari, tanaman B layu.\n\nKesimpulan yang tepat adalah ....', o:['Tanaman tidak membutuhkan air','Air membantu tanaman tetap hidup','Tanaman hanya membutuhkan batu','Air membuat tanaman mati'], j:1, b:'Air dibutuhkan tanaman agar tetap hidup.'},
        {t:'pg', q:'21. Perhatikan urutan berikut: Es batu -> Air -> Uap air. Perubahan wujud dari air menjadi uap air disebut ....', o:['Membeku','Mencair','Menguap','Mengembun'], j:2, b:'Cair menjadi gas disebut menguap.'},
        {t:'pg', q:'22. Benda berikut yang paling baik digunakan untuk melihat benda di baliknya adalah ....', o:['Kayu','Kardus','Kaca bening','Batu'], j:2, b:'Kaca bening tembus cahaya.'},
        {t:'pg', q:'23. Budi memukul dua benda. Benda pertama menghasilkan suara nyaring, sedangkan benda kedua menghasilkan suara pelan.\n\nIndra yang digunakan untuk membedakan kedua suara tersebut adalah ....', o:['Penglihatan','Pendengaran','Penciuman','Peraba'], j:1, b:'Telinga sebagai indra pendengaran membedakan bunyi.'},
        {t:'pg', q:'24. (ENGLISH) Which part of the body is used to hear sounds?', o:['Eyes','Nose','Ears','Hands'], j:2, b:'Ears artinya telinga untuk mendengar.'},
        {t:'pg', q:'25. (ENGLISH) Which one is a living thing?', o:['Rock','Chair','Tree','Pencil'], j:2, b:'Tree (pohon) adalah makhluk hidup.'},
        {t:'esai', q:'ESAI 1. Sebutkan lima pancaindra manusia beserta kegunaan masing-masing!', b:'1. Mata (penglihatan), 2. Telinga (pendengaran), 3. Hidung (penciuman), 4. Lidah (pengecap), 5. Kulit (peraba).'},
        {t:'esai', q:'ESAI 2. Tuliskan empat ciri-ciri makhluk hidup!', b:'Bernapas, butuh makan/air, bergerak, tumbuh & berkembang biak.'},
        {t:'esai', q:'ESAI 3. Mengapa tanaman membutuhkan air dan cahaya matahari untuk tumbuh?', b:'Untuk melakukan fotosintesis (membuat makanan sendiri) agar tumbuh subur.'},
        {t:'esai', q:'ESAI 4. Jelaskan mengapa kita dapat melihat bayangan tubuh ketika berdiri di bawah sinar matahari!', b:'Karena cahaya merambat lurus dan terhalang oleh tubuh kita yang tidak tembus cahaya.'},
        {t:'esai', q:'ESAI 5. Perhatikan percobaan es batu wadah A di bawah matahari dan wadah B di ruangan sejuk. Es batu manakah yang lebih cepat mencair? Mengapa?', b:'Wadah A lebih cepat mencair karena mendapat energi panas langsung dari matahari.'}
      ],
      "Paket 2 - Bermain Sains": [
        {t:'pg', q:'1. Rani menutup mata, kemudian ibunya memberikan sebuah benda berbentuk bulat dan beraroma harum. Rani dapat mengetahui aroma benda tersebut tanpa melihatnya. Indra yang membantu Rani adalah ....', o:['Penglihatan','Penciuman','Pendengaran','Peraba'], j:1, b:'Hidung merupakan indra penciuman yang berfungsi mengenali bau atau aroma benda meskipun mata tertutup.'},
        {t:'pg', q:'2. Edo memegang gelas berisi air hangat. Setelah beberapa saat, tangannya merasakan suhu gelas tersebut. Bagian tubuh yang menerima rangsangan panas adalah ....', o:['Kulit','Hidung','Lidah','Mata'], j:0, b:'Kulit adalah indra peraba yang peka terhadap rangsangan panas, dingin, kasar, dan halus.'},
        {t:'pg', q:'3. Beni sedang makan permen sambil menutup hidungnya. Ia merasa rasa dan aroma permen tidak senikmat biasanya. Kesimpulan yang paling tepat adalah ....', o:['Hidung hanya digunakan untuk bernapas','Indra penciuman dapat membantu mengenali rasa makanan','Mata membantu merasakan makanan','Telinga menentukan rasa makanan'], j:1, b:'Indra penciuman (hidung) bekerja sama dengan indra pengecap (lidah) sehingga kita bisa mengenali aroma dan kelezatan makanan.'},
        {t:'pg', q:'4. Seekor ayam bertelur, sedangkan seekor kucing melahirkan anaknya. Meskipun caranya berbeda, kedua hewan tersebut memiliki persamaan, yaitu ....', o:['Sama-sama berkembang biak','Sama-sama bertelur','Sama-sama menyusui anaknya','Sama-sama hidup di air'], j:0, b:'Bertelur dan melahirkan adalah cara makhluk hidup berkembang biak untuk menghasilkan keturunan.'},
        {t:'pg', q:'5. Dita mengamati dua tanaman yang sama. Tanaman A disiram setiap hari, sedangkan tanaman B tidak pernah disiram. Setelah beberapa hari, tanaman B layu. Jika tanaman B terus tidak mendapatkan air, kemungkinan yang terjadi adalah ....', o:['Tumbuh semakin subur','Menghasilkan lebih banyak daun','Mengering dan akhirnya mati','Berubah menjadi batu'], j:2, b:'Air sangat dibutuhkan tanaman untuk bertahan hidup. Tanpa air, tanaman akan layu, mengering, lalu mati.'},
        {t:'pg', q:'6. Perhatikan empat benda berikut: (1) Kucing, (2) Mobil mainan, (3) Pohon mangga, (4) Boneka. Pasangan yang memiliki ciri dapat tumbuh dan berkembang adalah ....', o:['1 dan 2','2 dan 4','1 dan 3','3 dan 4'], j:2, b:'Kucing (hewan) dan pohon mangga (tumbuhan) adalah makhluk hidup yang dapat tumbuh dan berkembang, sedangkan mobil mainan dan boneka adalah benda mati.'},
         {t:'pg', q:'7. Ayah menyalakan kipas angin menggunakan listrik. Ketika listrik mati, kipas berhenti berputar. Hal ini menunjukkan bahwa kipas angin membutuhkan ....', o:['Energi cahaya','Energi listrik','Energi bunyi','Energi makanan'], j:1, b:'Kipas angin mengubah energi listrik menjadi energi gerak untuk memutar baling-balingnya.'},
        {t:'pg', q:'8. Siti menggosokkan kedua telapak tangannya dengan cepat. Setelah beberapa saat, tangannya terasa hangat. Peristiwa tersebut menunjukkan bahwa ....', o:['Gerakan dapat menghasilkan panas','Panas selalu berasal dari matahari','Tangan menghasilkan air','Gerakan menghilangkan energi'], j:0, b:'Gesekan atau gerakan dua benda yang saling bersentuhan dapat mengubah energi gerak menjadi energi panas.'},
        {t:'pg', q:'9. Perhatikan kegiatan berikut: anak berlari, lampu menyala, radio berbunyi, setrika menjadi panas. Kegiatan yang paling jelas menunjukkan perubahan energi listrik menjadi energi bunyi adalah ....', o:['Anak berlari','Lampu menyala','Radio berbunyi','Setrika menjadi panas'], j:2, b:'Radio menggunakan energi listrik dan mengubahnya menjadi energi bunyi yang bisa kita dengar.'},
        {t:'pg', q:'10. Ibu memasak air menggunakan kompor. Setelah beberapa menit, muncul uap dari panci. Jika air terus dipanaskan, perubahan yang terjadi adalah ....', o:['Air berubah menjadi es','Air berubah menjadi uap','Air berubah menjadi minyak','Air berubah menjadi batu'], j:1, b:'Pemanasan terus-menerus membuat air mendidih dan menguap (berubah wujud dari cair menjadi gas/uap air).'},
        {t:'pg', q:'11. Andi mempunyai dua es batu dengan ukuran sama. Es pertama diletakkan di bawah sinar matahari, sedangkan es kedua diletakkan di dalam lemari pendingin. Es yang lebih cepat mencair adalah ....', o:['Es pertama, karena menerima panas lebih banyak','Es kedua, karena berada di tempat dingin','Keduanya pasti mencair dengan waktu sama','Keduanya tidak akan mencair'], j:0, b:'Es pertama menerima energi panas langsung dari sinar matahari sehingga lebih cepat mencair daripada es di tempat dingin.'},
        {t:'pg', q:'12. Pada pagi hari, bagian luar gelas berisi air es menjadi basah meskipun tidak ada air yang tumpah. Peristiwa tersebut terjadi karena ....', o:['Air dari dalam gelas merembes keluar','Uap air di udara berubah menjadi titik-titik air','Gelas menghasilkan air sendiri','Es berubah menjadi udara'], j:1, b:'Uap air di udara sekitar gelas yang dingin mengalami pengembunan dan berubah menjadi titik-titik air di dinding luar gelas.'},
        {t:'pg', q:'13. Budi berdiri di bawah sinar matahari dan melihat bayangannya di tanah. Ketika Budi berpindah ke tempat yang teduh, bayangannya menjadi kurang jelas. Penyebabnya adalah ....', o:['Bayangan membutuhkan cahaya dan benda yang menghalangi cahaya','Bayangan merupakan benda hidup','Bayangan dapat bergerak sendiri','Bayangan berasal dari tanah'], j:0, b:'Bayangan terbentuk dengan jelas apabila ada sumber cahaya terang yang terhalang oleh benda tidak tembus cahaya.'},
        {t:'pg', q:'14. Ani memiliki tiga benda: kaca bening, karton, dan plastik buram. Ia ingin melihat gambar yang berada di balik salah satu benda tersebut dengan jelas. Benda yang sebaiknya dipilih adalah ....', o:['Karton','Plastik buram','Kaca bening','Semua benda sama'], j:2, b:'Kaca bening bersifat tembus cahaya (transparan) sehingga gambar di baliknya dapat terlihat dengan jelas.'},
        {t:'pg', q:'15. Pada siang hari, bayangan tiang terlihat lebih pendek dibandingkan bayangan pada pagi atau sore hari dalam kondisi tertentu. Hal ini berkaitan dengan ....', o:['Perubahan posisi semu matahari di langit','Tiang semakin pendek','Tanah semakin tinggi','Cahaya matahari menghilang'], j:0, b:'Posisi matahari yang tampak tinggi tepat di atas pada siang hari membuat bayangan benda menjadi lebih pendek dibanding saat matahari rendah di pagi atau sore hari.'},
        {t:'pg', q:'16. Raka melihat Bulan pada malam hari. Beberapa malam kemudian, bentuk Bulan yang terlihat berbeda. Kesimpulan yang tepat adalah ....', o:['Bulan berubah menjadi benda lain','Bentuk bagian Bulan yang terkena cahaya matahari dan terlihat dari Bumi berubah','Bulan mati pada malam tertentu','Bulan menghasilkan cahaya yang semakin besar'], j:1, b:'Bentuk Bulan tampak berubah-ubah (fase bulan) karena perubahan posisi Bulan saat mengelilingi Bumi sehingga bagian yang memantulkan cahaya matahari terlihat berbeda.'},
        {t:'pg', q:'17. Jika Matahari tiba-tiba tidak memberikan cahaya kepada Bumi, keadaan yang paling mungkin terjadi adalah ....', o:['Bumi menjadi lebih terang','Bumi menjadi gelap','Bintang berhenti ada','Bulan berubah menjadi Matahari'], j:1, b:'Matahari adalah sumber cahaya utama bagi Bumi. Tanpa cahaya Matahari, seluruh Bumi akan menjadi gelap gulita dan dingin.'},
        {t:'pg', q:'18. Bumi berputar pada porosnya. Ketika Indonesia mengalami siang hari, beberapa wilayah di bagian lain Bumi dapat mengalami malam hari. Mengapa hal tersebut terjadi?', o:['Bumi memiliki bagian yang menghadap Matahari dan bagian yang membelakanginya','Matahari hanya menyinari Indonesia','Bulan menutupi seluruh Bumi','Matahari mengelilingi Indonesia'], j:0, b:'Karena bentuk Bumi bulat dan berputar pada porosnya (rotasi), sisi yang menghadap Matahari mengalami siang, sedangkan sisi sebaliknya mengalami malam.'},
        {t:'pg', q:'19. Perhatikan hasil pengamatan berikut: Ikan bergerak dan membutuhkan makanan; batu tidak tumbuh; pohon tumbuh dan membutuhkan air; sepeda bergerak jika dikayuh. Berdasarkan pengamatan tersebut, pasangan makhluk hidup adalah ....', o:['Ikan dan pohon','Batu dan sepeda','Ikan dan sepeda','Pohon dan batu'], j:0, b:'Ikan dan pohon menunjukkan ciri makhluk hidup seperti tumbuh, bergerak sendiri, dan membutuhkan makanan serta air.'},
        {t:'pg', q:'20. Lala ingin mengetahui apakah cahaya matahari memengaruhi pertumbuhan tanaman. Ia menyiapkan dua tanaman yang sama. Keduanya disiram dengan jumlah air yang sama. Tanaman A diletakkan di tempat terang, sedangkan tanaman B di tempat gelap. Hal yang harus diamati Lala adalah ....', o:['Warna dan pertumbuhan kedua tanaman','Harga kedua pot','Ukuran meja tempat tanaman diletakkan','Jumlah mainan di sekitar tanaman'], j:0, b:'Untuk melihat pengaruh cahaya matahari, Lala perlu mengamati perbedaan warna daun dan tinggi pertumbuhan kedua tanaman tersebut.'},
         {t:'pg', q:'21. Dalam percobaan, sebuah sendok logam dan sendok plastik dimasukkan ke dalam air hangat. Setelah beberapa saat, sendok logam terasa lebih hangat ketika disentuh pada bagian pegangannya. Kesimpulan yang paling tepat adalah ....', o:['Logam lebih mudah menghantarkan panas daripada plastik','Plastik menghasilkan api','Logam tidak dapat menerima panas','Air hangat berubah menjadi logam'], j:0, b:'Logam merupakan penghantar panas (konduktor) yang baik sehingga panas dari air hangat cepat merambat ke pegangan sendok.'},
        {t:'pg', q:'22. Tono ingin mengetahui benda mana yang paling cepat mengeringkan pakaian. Ia menjemur dua kain basah dengan ukuran sama. Kain A diletakkan di bawah matahari, sedangkan kain B diletakkan di tempat teduh. Agar percobaan adil, hal yang harus dibuat sama adalah ....', o:['Ukuran dan jumlah air pada kedua kain','Warna tempat menjemur saja','Nama kedua kain','Posisi rumah terhadap jalan'], j:0, b:'Dalam percobaan yang adil, faktor lain selain tempat menjemur harus dibuat sama, yaitu ukuran kain dan banyaknya air pada kain.'},
        {t:'pg', q:'23. Seorang anak mengamati bahwa tanaman yang diletakkan dekat jendela tumbuh condong ke arah datangnya cahaya. Penjelasan yang paling tepat adalah ....', o:['Tanaman dapat merespons arah datangnya cahaya','Tanaman ingin keluar dari pot','Tanaman dapat berjalan','Tanaman tidak membutuhkan cahaya'], j:0, b:'Makhluk hidup peka terhadap rangsangan. Batang tanaman merespons rangsangan cahaya matahari dengan tumbuh membengkok ke arah datangnya cahaya.'},
        {t:'pg', q:'24. (ENGLISH) Tom puts an ice cube under the hot sun. What will happen to the ice cube?', o:['It will become harder','It will melt','It will become a stone','It will disappear forever'], j:1, b:'"It will melt" artinya es batu akan mencair karena terkena panas terik matahari.'},
        {t:'pg', q:'25. (ENGLISH) Lisa sees a plant with yellow leaves and dry soil. What should she do first?', o:['Give the plant some water','Put the plant in a dark box','Cut all the roots','Cover the plant with plastic'], j:0, b:'Tanah kering (dry soil) dan daun menguning menandakan tanaman kekurangan air, sehingga Lisa harus menyiramnya (give the plant some water).'},
        {t:'esai', q:'ESAI 1. Rina menutup matanya dan diminta mengenali tiga benda: bunga, lonceng, dan es batu.\na. Indra apa yang digunakan untuk mengenali bunga?\nb. Indra apa yang digunakan untuk mengenali suara lonceng?\nc. Indra apa yang digunakan untuk merasakan dinginnya es batu?', b:'a. Indra penciuman (hidung) untuk mencium aroma bunga.\nb. Indra pendengaran (telinga) untuk mendengar bunyi lonceng.\nc. Indra peraba (kulit) untuk merasakan suhu dingin es batu.'},
        {t:'esai', q:'ESAI 2. Dua tanaman yang ukurannya sama diletakkan di tempat berbeda. Tanaman A mendapat air dan cahaya matahari, sedangkan tanaman B tidak mendapatkan air dan cahaya matahari. Setelah satu minggu, tanaman A tumbuh lebih baik daripada tanaman B. Jelaskan mengapa hal tersebut bisa terjadi!', b:'Karena tanaman membutuhkan air dan cahaya matahari untuk melakukan fotosintesis (membuat makanannya sendiri). Tanaman A mendapatkan keduanya sehingga tumbuh subur, sedangkan tanaman B tidak bisa membuat makanan sehingga pertumbuhannya terhambat dan layu.'},
        {t:'esai', q:'ESAI 3. Ibu memasukkan air ke dalam panci dan memanaskannya sampai mendidih.\na. Apa yang terjadi pada air ketika dipanaskan?\nb. Mengapa muncul uap?\nc. Apa yang akan terjadi jika uap air mengenai permukaan yang dingin?', b:'a. Suhu air naik hingga mendidih dan volumenya berkurang.\nb. Karena air menerima energi panas sehingga berubah wujud dari benda cair menjadi gas (menguap).\nc. Uap air akan mengalami pengembunan dan berubah kembali menjadi titik-titik air.'},
        {t:'esai', q:'ESAI 4. Pada pagi hari, seorang anak melihat bayangan pohon di tanah. Ketika awan tebal menutupi matahari, bayangan pohon menjadi kurang jelas. Mengapa bayangan pohon menjadi kurang jelas? Jelaskan!', b:'Karena awan tebal menghalangi sebagian besar cahaya matahari yang menuju ke pohon. Ketika cahaya yang datang berkurang atau redup, bayangan yang terbentuk menjadi samar dan kurang jelas.'},

 let semuaData = [], anakAktif = '', mapelAktif = '', daftarSoal = [], indeks = 0, skorPG = 0, totalPG = 0;

function bicara(teks) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(teks);
    u.lang = 'id-ID'; u.rate = 1.0; u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function bunyiNada(freqs, durasi, tipe = 'sine') {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  freqs.forEach((f, idx) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = tipe;
    osc.frequency.setValueAtTime(f, audioCtx.currentTime + idx * 0.12);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.12);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.12 + durasi);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + idx * 0.12);
    osc.stop(audioCtx.currentTime + idx * 0.12 + durasi);
  });
}

function bunyiTepukTangan() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  for (let i = 0; i < 20; i++) {
    const waktu = audioCtx.currentTime + i * 0.1, bufferSize = audioCtx.sampleRate * 0.08;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate), data = buffer.getChannelData(0);
    for (let j = 0; j < bufferSize; j++) data[j] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 1100 + Math.random() * 400;
    const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.25, waktu);
    gain.gain.exponentialRampToValueAtTime(0.01, waktu + 0.07);
    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    noise.start(waktu);
  }
       }

 let daftarSalah = [];

}

function tampilkanSoal() {
  const s = daftarSoal[indeks];
  const badge = document.getElementById('badge-tipe');
  document.getElementById('info-soal').innerText = `Soal ${indeks + 1} / ${daftarSoal.length}`;

  wOpsi.classList.add('hidden'); wEsai.classList.add('hidden'); wGaris.classList.add('hidden');

  if (s.t === 'pg' || s.tipe === 'pg') {
    if (badge) badge.innerText = 'Pilihan Ganda';
    wOpsi.classList.remove('hidden'); wOpsi.innerHTML = '';

    s.o.forEach((teks, i) => {

  } else {
    if (badge) badge.innerText = 'Soal Esai (Uraian)';
    wEsai.classList.remove('hidden');
    const inp = document.getElementById('input-jawaban-esai');

    document.getElementById('tombol-cek-esai').classList.remove('hidden');
  }
  window.scrollTo(0, 0);
}

let pilihKiri = null, jumlahCocok = 0;
function buatSoalGaris(s, wadah) {
  pilihKiri = null; jumlahCocok = 0;
  const kananAcak = [...s.pasang].map((item, idx) => ({ ...item, idAsli: idx })).sort(() => Math.random() - 0.5);
  wadah.innerHTML = `<div class="match-wrap" id="area-match"><svg class="match-svg" id="svg-garis"></svg><div class="match-col" id="kol-kiri"></div><div class="match-col" id="kol-kanan"></div></div>`;
  const colKiri = document.getElementById('kol-kiri'), colKanan = document.getElementById('kol-kanan');

  s.pasang.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'match-box'; div.id = 'kiri-' + idx;
    div.innerHTML = `<span>${item.kiri}</span><span class="titik"></span>`;
    div.onclick = () => {
      if (div.classList.contains('cocok')) return;
      document.querySelectorAll('#kol-kiri .match-box').forEach(el => el.classList.remove('pilih'));
      div.classList.add('pilih');
      pilihKiri = { idx, el: div, warna: item.warna };
    };
    colKiri.appendChild(div);
  });

  kananAcak.forEach(item => {
    const div = document.createElement('div');
    div.className = 'match-box kanan'; div.id = 'kanan-' + item.idAsli;
    div.innerHTML = `<span>${item.kanan}</span><span class="titik"></span>`;
    div.onclick = () => {
      if (!pilihKiri || div.classList.contains('cocok')) return;
      const st = document.getElementById('status-jawaban');
      if (pilihKiri.idx === item.idAsli) {
        pilihKiri.el.classList.remove('pilih');
        pilihKiri.el.classList.add('cocok');
        div.classList.add('cocok');
        gambarGarisSVG(pilihKiri.el, div, pilihKiri.warna);
        bunyiNada(new Array(523, 784), 0.2);
        pilihKiri = null; jumlahCocok++;
        if (jumlahCocok === s.pasang.length) {
          st.innerHTML = `<div style="font-size:42px; margin-top:8px;">🎉</div><div class="benar-text">Yeah!! Semua Garis Benar!</div>`;
          skorPG++; bunyiNada(new Array(523, 659, 784, 1046), 0.25); bicara('Yeah! Hebat!');
          setTimeout(() => { soalBerikutnya(); }, 1500);
        }
      } else {
        if (!daftarSalah.includes(indeks + 1)) daftarSalah.push(indeks + 1);
        bunyiNada(new Array(300, 220), 0.25, 'sawtooth');
        bicara('Yahhh, coba pasangan lain!');
        st.innerHTML = `<div class="salah-text">😢 Belum pas, coba ketuk gambar yang jumlahnya sama!</div>`;
        setTimeout(() => { if (jumlahCocok < s.pasang.length) st.innerHTML = ''; }, 1200);
      }
    };
    colKanan.appendChild(div);
  });
 }
 function gambarGarisSVG(elKiri, elKanan, warna) {
  const area = document.getElementById('area-match').getBoundingClientRect();
  const r1 = elKiri.querySelector('.titik').getBoundingClientRect();
  const r2 = elKanan.querySelector('.titik').getBoundingClientRect();
  const svg = document.getElementById('svg-garis');
  const line = document.createElementNS('http://w3.org', 'line');
  line.setAttribute('x1', r1.left - area.left + 7);
  line.setAttribute('y1', r1.top - area.top + 7);
  line.setAttribute('x2', r2.left - area.left + 7);
  line.setAttribute('y2', r2.top - area.top + 7);
  line.setAttribute('stroke', warna);
  line.setAttribute('stroke-width', '5');
  line.setAttribute('stroke-linecap', 'round');
  svg.appendChild(line);
}

function cekPG(pilihan, btnPilih) {

    skorPG++; bunyiNada(new Array(523, 659, 784, 1046), 0.25); bicara('Yeah! Betul!');
    setTimeout(() => { soalBerikutnya(); }, 1300);
  } else {

    const semua = document.querySelectorAll('.btn-opt');

    bunyiNada(new Array(350, 280, 210), 0.3, 'sawtooth'); bicara('Yahhh, salah nih!');
    box.innerHTML = `<strong>💡 Pembahasan:</strong>\n${s.b}`; box.classList.remove('hidden');
    document.getElementById('tombol-lanjut').classList.remove('hidden');
  }
}

function soalBerikutnya() {
  indeks++;
  if (indeks < daftarSoal.length) {
    tampilkanSoal();
  } else {
    document.getElementById('area-kuis').classList.add('hidden');
    document.getElementById('area-hasil').classList.remove('hidden');
    daftarSalah.sort((a, b) => a - b);
    const teksNomorSalah = daftarSalah.length > 0
      ? `<div style="margin-top:15px; padding:14px; background:#ffe5ec; border:2px solid #ef476f; color:#d90429; border-radius:14px; font-size:17px;">❌ Nomor yang salah:<br><span style="font-size:22px;">${daftarSalah.join(', ')}</span></div>`
      : `<div style="margin-top:15px; padding:14px; background:#d8f3dc; border:2px solid #06d6a0; color:#007f5f; border-radius:14px; font-size:17px;">🌟 Luar biasa! Semua nomor benar!</div>`;
    document.getElementById('teks-skor').innerHTML = `Pilihan Ganda: Benar ${skorPG} dari ${totalPG} soal ⭐${teksNomorSalah}`;
    const riwayat = JSON.parse(localStorage.getItem('riwayatSalahOlimpiade') || '[]');
    riwayat.push({ waktu: new Date().toLocaleString('id-ID'), anak: anakAktif, mapel: mapelAktif, salah: daftarSalah });
    localStorage.setItem('riwayatSalahOlimpiade', JSON.stringify(riwayat));
    bunyiTepukTangan(); bicara('Horeee selesai! Hebat sekali!');
  }
  }
